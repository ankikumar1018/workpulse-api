# Alembic configuration

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to the `datetime.datetime.fromtimestamp()` function
# to produce the datetime object used as default for "now" in :mtype:`~.IncludeDirective.from_config`
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field:
# set to -1 to disable, otherwise it's used as
# the truncation length for Alembic's filename generation.
# causes the following template files to take the truncation
# into account when generating the `` candidate name:
# "generic" - resolvable;
# "postgreSQL" - resolvable;
# "mysql" - resolvable;
# "oracle" - resolvable;
# "mssql" - resolvable;
# The default value is -1, any positive value truncates 
# the name.
truncate_slug_len = 40

# Logging configuration
[loggers]
keys = root,sqlalchemy.engine

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy.engine]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
