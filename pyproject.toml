[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workpulse-api"
version = "0.1.0"
description = "WorkPulse: FastAPI backend for workforce communication automation platform"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "WorkPulse Team"},
]
keywords = [
    "fastapi",
    "async",
    "api",
    "workforce",
    "messaging",
    "automation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Web Framework
    "fastapi[standard]==0.141.1",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.20",
    
    # Database
    "sqlalchemy==2.0.52",
    "psycopg[binary]==3.3.4",
    "alembic==1.14.0",
    
    # Data Validation
    "pydantic==2.13.4",
    "pydantic-settings==2.6.1",
    
    # Utilities
    "python-dotenv==1.0.1",
    "httpx==0.28.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-dateutil==2.8.2",
    
    # Observability
    "structlog==25.1.0",
    "python-json-logger==4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-httpx==0.35.0",
    "httpx2==2.12.0",
    "black==26.5.1",
    "isort==5.13.2",
    "ruff==0.16.4",
    "mypy==1.14.1",
    "types-python-dateutil==2.9.0.20260807",
    "types-pytz==2026.3.1.20260727",
]
test = [
    "pytest==8.4.2",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-httpx==0.35.0",
    "httpx2==2.12.0",
]

[project.urls]
Homepage = "https://github.com/workpulse/workpulse-api"
Repository = "https://github.com/workpulse/workpulse-api.git"
Issues = "https://github.com/workpulse/workpulse-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
    "app",
    "alembic",
    "alembic.ini",
    "README.md",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-httpx==0.35.0",
    "httpx2==2.12.0",
    "black==26.5.1",
    "isort==5.13.2",
    "ruff==0.16.4",
    "mypy==1.14.1",
    "types-python-dateutil==2.9.0.20260807",
    "types-pytz==2026.3.1.20260727",
]

[tool.black]
line-length = 100
target-version = ["py314"]
extend-exclude = '''
/(
    \.git
  | \.venv
  | \.env
  | build
  | dist
  | htmlcov
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = [".venv"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by black)
    "W605",   # invalid escape sequence (false positives)
    "ARG001", # unused function argument (common in callbacks)
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
